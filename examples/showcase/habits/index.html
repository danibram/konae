<main class="shell">
  <header class="top">
    <div>
      <h1>Habits</h1>
      <p class="muted" id="today"></p>
    </div>
    <div class="who" id="who"></div>
  </header>

  <section id="gate" class="card gate" hidden>
    <h2>Keep a streak on every device</h2>
    <p class="muted">Sign in with the same account on your phone and your computer. Your habits and check-ins belong to your account, and nobody else can read them.</p>
    <button type="button" class="primary" id="signin">Sign in or create an account</button>
  </section>

  <section id="app" hidden>
    <form id="add" class="add">
      <label class="sr" for="name">New habit</label>
      <input id="name" name="name" maxlength="60" placeholder="New habit, such as Read 20 pages" autocomplete="off" required>
      <button type="submit" class="primary">Add habit</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <ol id="habits" class="habits"></ol>
    <div id="empty" class="card empty" hidden>
      <h2>No habits yet</h2>
      <p class="muted">Add one above. Check it off each day to grow its streak.</p>
    </div>
  </section>

  <footer class="foot muted"><span id="device"></span> <span id="build">Build 1</span></footer>
</main>
