<main class="wrap">
  <h1>Which day should the market move to?</h1>
  <p class="muted">One vote per browser. Results update live.</p>
  <div id="options" class="options"></div>
  <p id="status" class="muted" role="status"></p>
  <section class="report">
    <h2>Results <small id="total" class="muted"></small></h2>
    <div id="bars" class="bars"></div>
    <h2>Votes per hour</h2>
    <div id="hours" class="hours"></div>
  </section>
</main>
