<main class="wrap">
  <header><h1>Clay &amp; Smoke</h1><p class="muted">Pots from a wood kiln in the hills. <span id="who"></span></p></header>
  <section id="editor" hidden>
    <h2>New piece</h2>
    <form id="post"><input id="title" placeholder="Title" required maxlength="80"><textarea id="body" placeholder="A few words" rows="2"></textarea>
      <label>Photo <input id="photo" type="file" accept="image/*"></label>
      <label><input type="checkbox" id="inline" checked> also store a small inline copy so signed-out readers can see it</label>
      <button>Publish piece</button></form>
    <p id="status" class="muted" role="status"></p>
  </section>
  <section id="gallery" class="gallery"></section>
  <footer class="muted"><a href="/_littlebox/login">Studio sign-in</a></footer>
</main>
