name: Functions runner

on:
  pull_request:
    paths:
      - .github/workflows/functions-runner.yml
      - kernel-rs/Cargo.toml
      - kernel-rs/functions-executor/**
      - kernel-rs/functions-runner/**
      - kernel-rs/functions-runner-wasm/**
      - kernel-rs/functions-prepare/**
      - kernel-rs/kernel/src/functions/**
      - kernel-rs/kernel/src/app_folders/folder.rs
      - scripts/build-functions-runner.sh
      - scripts/build-functions-images.sh
      - ops/kernel-entrypoint.sh
      - Dockerfile.functions-runner
      - Dockerfile.kernel
      - Dockerfile.konae
      - docker-compose.yml
      - .dockerignore
      - scripts/test-exported-functions-compose.sh
      - docs/operate.md
      - src/lib/app-folder.ts
      - src/lib/app-folder.test.ts
      - docs/functions.md
      - docs/guides/take-the-app-elsewhere.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Test the runner and watchdog
        run: cargo test --release --locked --manifest-path kernel-rs/functions-runner/Cargo.toml

  wasm-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned component tools
        run: |
          npm install --prefix "$RUNNER_TEMP/starling-tools" --no-audit --no-fund --save-exact \
            @bytecodealliance/componentize-js@0.21.0 @bytecodealliance/jco@1.42.0 \
            @bytecodealliance/wizer@10.0.0 esbuild@0.25.12 es-module-lexer@1.7.0
      - name: Build preparation helper
        env:
          KONAE_STARLING_TOOLS: ${{ runner.temp }}/starling-tools
        run: |
          cargo test --release --locked --manifest-path kernel-rs/functions-prepare/Cargo.toml -- --test-threads=1
          cargo build --release --locked --manifest-path kernel-rs/functions-prepare/Cargo.toml
      - name: Test StarlingMonkey worker and watchdog
        env:
          KONAE_FUNCTIONS_PREPARER: ${{ github.workspace }}/kernel-rs/functions-prepare/target/release/konae-functions-prepare
        run: cargo test --release --locked --manifest-path kernel-rs/functions-runner-wasm/Cargo.toml -- --test-threads=1

  export-compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: amd64
          - host: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install editor dependencies
        run: bun install --frozen-lockfile
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build both packaged runners and the Wasm preparer
        id: package
        run: scripts/build-functions-runner.sh "${{ matrix.arch }}" "$RUNNER_TEMP/functions-packaged"
      - name: Run exported Wasm app under default Compose security profiles
        env:
          KONAE_FUNCTIONS_RUNNER_CONTEXT: ${{ runner.temp }}/functions-packaged
        run: scripts/test-exported-functions-compose.sh wasm
      - name: Run exported deno_core app with development polling
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          KONAE_FUNCTIONS_RUNNER_CONTEXT: ${{ runner.temp }}/functions-packaged
        run: scripts/test-exported-functions-compose.sh deno

  strict-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
      - name: Install editor dependencies
        run: bun install --frozen-lockfile
      - name: Build the runner for this Linux architecture
        run: cargo build --release --locked --manifest-path kernel-rs/functions-runner/Cargo.toml
      - name: Build the Kernel test binary
        run: cargo test --locked --manifest-path kernel-rs/Cargo.toml -p kernel --lib --no-run
      - name: Run ignored real-worker tests under a delegated cgroup v2 scope
        # systemd-run with Delegate=yes gives this step its own cgroup v2 subtree, the same route
        # docs/operate.md names for a systemd-managed service. The Kernel identity is the runner user
        # with CAP_SETUID and CAP_SETGID; workers drop to the nobody identity.
        run: |
          mkdir -p "$RUNNER_TEMP/functions-runner"
          install -m 755 kernel-rs/functions-runner/target/release/konae-functions-runner "$RUNNER_TEMP/functions-runner/konae-functions-runner"
          test_binary=$(find kernel-rs/target/debug/deps -maxdepth 1 -type f -name "kernel-*" -perm -111 | head -n 1)
          test -n "$test_binary"
          uname -srmo
          sudo env KERNEL_UID="$(id -u)" KERNEL_GID="$(id -g)" TEST_BINARY="$PWD/$test_binary" \
            RUNNER_BIN="$RUNNER_TEMP/functions-runner/konae-functions-runner" \
            systemd-run --scope --quiet --collect --property=Delegate=yes --unit="konae-functions-strict-$$" sh -ec '
              cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)
              test -f "$cg/cgroup.controllers"
              grep -qw memory "$cg/cgroup.controllers"
              grep -qw pids "$cg/cgroup.controllers"
              mkdir "$cg/setup"
              echo "$$" > "$cg/setup/cgroup.procs"
              echo "+memory +pids" > "$cg/cgroup.subtree_control"
              mkdir "$cg/delegated"
              echo "+memory +pids" > "$cg/delegated/cgroup.subtree_control"
              mkdir "$cg/delegated/kernel-manager"
              echo "$$" > "$cg/delegated/kernel-manager/cgroup.procs"
              test -e "$cg/delegated/cgroup.kill"
              chown "$KERNEL_UID:$KERNEL_GID" "$cg/delegated" "$cg/delegated/cgroup.procs" "$cg/delegated/kernel-manager" "$cg/delegated/kernel-manager/cgroup.procs"
              run_tests() {
                setpriv --reuid="$KERNEL_UID" --regid="$KERNEL_GID" --clear-groups --bounding-set=-all,+setuid,+setgid,+kill \
                  --inh-caps=+setuid,+setgid,+kill --ambient-caps=+setuid,+setgid,+kill --no-new-privs \
                  env HOME=/tmp KONAE_FUNCTIONS_UID=65534 KONAE_FUNCTIONS_GID=65534 \
                  KONAE_TEST_FUNCTION_WORKER="$RUNNER_BIN" KONAE_TEST_FUNCTION_CGROUP="$cg/delegated" \
                  "$TEST_BINARY" "$@" --ignored --test-threads=1
              }
              diagnose() {
                echo "::group::workers and cgroups left after the failure"
                ps -o pid,ppid,uid,stat,rss,etime,cmd -u 65534 || true
                for group in "$cg"/delegated/konae-worker-*; do
                  test -d "$group" || continue
                  echo "== $group"
                  ls -ln "$group/cgroup.kill" "$group/cgroup.procs" || true
                  echo "procs: $(cat "$group/cgroup.procs" | tr "\n" " ")"
                  cat "$group/cgroup.events" "$group/memory.events" || true
                  echo "memory.current=$(cat "$group/memory.current") memory.max=$(cat "$group/memory.max")"
                  for pid in $(cat "$group/cgroup.procs"); do grep -E "^(State|SigPnd|ShdPnd|VmRSS):" "/proc/$pid/status" || true; done
                  echo "writing cgroup.kill as root"; echo 1 > "$group/cgroup.kill" || true; sleep 1
                  echo "procs after kill: $(cat "$group/cgroup.procs" | tr "\n" " ")"
                done
                dmesg --time-format iso 2>/dev/null | grep -i -E "oom|killed process|memory cgroup" | tail -n 30 || true
                echo "::endgroup::"
                exit 1
              }
              run_tests real_ || diagnose
              run_tests functions_export_import_executes_the_published_bundle_with_imported_identity || diagnose
            '
