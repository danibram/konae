[package]
name = "littlebox-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = "0.8"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

