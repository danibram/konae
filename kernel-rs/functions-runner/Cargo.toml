[package]
name = "konae-functions-runner"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
konae-functions-executor = { path = "../functions-executor" }
anyhow = "=1.0.100"
deno_core = "=0.413.0"
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
deno_net = "=0.252.0"
deno_fetch = "=0.284.0"
deno_permissions = "=0.119.0"
sys_traits = { version = "=0.1.28", features = ["real", "libc"] }
deno_error = "=0.7.1"
libc = "=0.2.191"
getrandom = "=0.3.4"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[[bin]]
name = "konae-functions-spike"
path = "src/main.rs"

[profile.release]
debug = 0
strip = "debuginfo"

[workspace]
