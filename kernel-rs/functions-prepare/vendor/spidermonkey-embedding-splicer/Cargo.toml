[package]
name = "spidermonkey-embedding-splicer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]

[dependencies]
anyhow = { version = "1.0.95", default-features = false }
heck = { version = "=0.5.0", default-features = false }
rand = { version = "=0.8.8", default-features = false }
serde_json = { version = "=1.0.140", default-features = false, features = ["alloc"] }
wirm = { version = "=5.0.0", default-features = false }
wasm-encoder = { version = "=0.245.1", features = ["component-model", "std"] }
wasmparser = { version = "=0.245.1", features = ["features", "component-model", "hash-collections", "serde", "simd", "std", "validate"] }
wit-component = { version = "=0.245.1", features = ["dummy-module"] }
wit-parser = { version = "=0.245.1", features = ["decoding", "serde"] }
wit-bindgen = { version = "=0.54.0", features = ["macros", "async", "realloc"] }
wit-bindgen-core = { version = "=0.54.0", default-features = false }
js-component-bindgen = { version = "=1.19.0", features = ["transpile-bindgen"] }

[lints.clippy]
too_many_arguments = "allow"
