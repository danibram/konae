[package]
name = "konae-functions-prepare"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
anyhow = "1.0"
oxc_allocator = "=0.67.0"
oxc_parser = "=0.67.0"
oxc_span = "=0.67.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
spidermonkey-embedding-splicer = { path = "vendor/spidermonkey-embedding-splicer" }
tempfile = "3.27.0"
libc = "0.2.191"
wasmtime = { version = "=38.0.4", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "pooling-allocator", "gc-null"] }
wit-component = "=0.245.1"
wirm = { version = "=5.0.0", default-features = false }

[build-dependencies]
anyhow = "1.0"
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
wasmtime = { version = "=38.0.4", default-features = false, features = ["std", "runtime", "cranelift"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
