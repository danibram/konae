map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Docker containers can be recreated while this gateway keeps running. Resolve
# service names through Docker's embedded DNS instead of pinning their old IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name editor.localhost;
  client_max_body_size 26m;

  set $kernel_upstream http://kernel:8787;
  set $builder_upstream http://builder:4173;

  location = /_littlebox/admin/database-lifecycle/plan {
    proxy_pass $builder_upstream;
    proxy_set_header Host $host;
  }

  location ^~ /_littlebox/admin/ {
    proxy_pass $kernel_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /_littlebox/health {
    proxy_pass $kernel_upstream;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass $builder_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80 default_server;
  server_name localhost *.localhost;
  client_max_body_size 4m;

  set $kernel_upstream http://kernel:8787;

  location / {
    proxy_pass $kernel_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
