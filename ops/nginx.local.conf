map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Docker containers can be recreated while this gateway keeps running. Resolve
# service names through Docker's embedded DNS instead of pinning their old IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name app.localhost;
  client_max_body_size 26m;

  set $kernel_upstream http://kernel:8787;
  set $builder_upstream http://builder:4173;

  location ~ ^/(mcp|_konae|oauth|\.well-known)(/|$) {
    proxy_pass $kernel_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Append the peer address. Passing the client's header through unchanged
    # would let it choose its own rate limit bucket.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location / {
    proxy_pass $builder_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# Every app host, and any other Host, lands here and reaches the Kernel with
# Host unchanged. That is how a custom domain (ADR-0015) reaches it: point the
# name at this gateway, prove it with domain_set, and the Kernel answers it as
# the app's own origin. In production, terminate TLS for the custom domain in
# its own server block and forward Host the same way, for example:
#
#   server {
#     listen 443 ssl;
#     server_name notes.example.org;
#     ssl_certificate     /etc/letsencrypt/live/notes.example.org/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/notes.example.org/privkey.pem;
#     location / {
#       proxy_pass http://kernel:8787;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-Proto https;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     }
#   }
#
# The Kernel looks up the TXT record itself, so it needs outbound DNS; set
# KONAE_DNS_RESOLVER when /etc/resolv.conf names no reachable resolver.
# The bare `localhost` answers the path addresses (`localhost/p/<id>`) and the
# home when KONAE_DOMAIN=localhost (ADR-0024). It needs no location of its
# own: this block forwards every path, and `$http_host` keeps Host as `localhost`.
server {
  listen 80 default_server;
  server_name localhost *.localhost;
  client_max_body_size 4m;

  set $kernel_upstream http://kernel:8787;

  location / {
    proxy_pass $kernel_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
