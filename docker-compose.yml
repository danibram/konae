networks:
  littlebox:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: littlebox
      MINIO_ROOT_PASSWORD: littlebox-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - littlebox

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 littlebox littlebox-secret &&
        mc mb --ignore-existing local/littlebox-apps &&
        mc mb --ignore-existing local/littlebox-data
    networks:
      - littlebox

  builder:
    build: .
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "4173"]
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
    expose:
      - "4173"
    networks:
      - littlebox

  kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LITTLEBOX_BIND: "0.0.0.0"
      # The e2e suites sign up owners with this well-known key. The Kernel refuses
      # it on a non-loopback bind unless LITTLEBOX_ALLOW_DEFAULT_KEY is 1. Only the
      # gateway is published, and only on 127.0.0.1.
      LITTLEBOX_ADMIN_KEY: local-development-key
      LITTLEBOX_ALLOW_DEFAULT_KEY: "1"
      LITTLEBOX_DATA_DIR: /data
      LITTLEBOX_KERNEL_PORT: "8787"
      LITTLEBOX_PUBLIC_ORIGIN: http://localhost:8080
      LITTLEBOX_HOST_SUFFIX: localhost
      LITTLEBOX_S3_ENDPOINT: http://minio:9000
      LITTLEBOX_S3_REGION: us-east-1
      LITTLEBOX_S3_ACCESS_KEY: littlebox
      LITTLEBOX_S3_SECRET_KEY: littlebox-secret
      LITTLEBOX_ARTIFACT_BUCKET: littlebox-apps
      LITTLEBOX_DATA_BUCKET: littlebox-data
      # The gateway has a fixed address on the littlebox network. The Kernel
      # trusts X-Forwarded-For only from that peer, so login and action limits
      # count the client nginx appended, not the container address.
      LITTLEBOX_TRUSTED_PROXIES: 172.30.10.10
    networks:
      - littlebox
    volumes:
      - littlebox-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/_littlebox/health"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 2s

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      builder:
        condition: service_started
      kernel:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./ops/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      littlebox:
        ipv4_address: 172.30.10.10

volumes:
  littlebox-data:
  minio-data:
